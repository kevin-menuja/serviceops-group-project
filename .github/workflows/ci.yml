name: Academic ServiceOps build checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: ASP.NET Core 10 build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore backend/ServiceOps.Api/ServiceOps.Api.csproj
      - run: dotnet build backend/ServiceOps.Api/ServiceOps.Api.csproj --configuration Release --no-restore

  frontend:
    name: Next.js lint, audit and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      BACKEND_API_URL: http://127.0.0.1:5010
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund
      - run: npm run lint
      - run: npm audit --omit=dev
      - run: npm run build
